# Builds your mod for Windows, Linux and macOS and publishes one zip that works on all three.
# Push a tag like 0.1.0+26.11.1 (<mod version>+<Weft version>) and download the result
# from your repository's Releases page.
#
# CI checks out Weft at the tag v<Weft version>, puts this repo in its mods/ folder and builds
# from there, so Cargo.toml keeps `weft_sdk = { path = "../../crates/sdk" }` and nothing else.
name: Release

on:
  push:
    tags: ['*\+*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux: the oldest available, since a library only runs on this glibc or newer.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Parse tag
        shell: bash
        run: |
          echo "MOD_VERSION=${GITHUB_REF_NAME%%+*}" >> "$GITHUB_ENV"
          echo "WEFT_TAG=v${GITHUB_REF_NAME#*+}" >> "$GITHUB_ENV"

      # Weft at the version the tag names. A typo'd or missing tag fails here.
      - uses: actions/checkout@v7
        with:
          repository: Weft-Rust/Weft
          ref: ${{ env.WEFT_TAG }}

      # This repo, as a member of Weft's workspace.
      - uses: actions/checkout@v7
        with:
          path: mods/mod

      - uses: dtolnay/rust-toolchain@stable   # a rust-toolchain.toml in Weft overrides this
      - uses: Swatinem/rust-cache@v2

      - name: Mod name, and check the version matches the tag
        shell: bash
        run: |
          name=$(grep -m1 '^name' mods/mod/Cargo.toml | cut -d'"' -f2)
          version=$(grep -m1 '^version' mods/mod/Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$MOD_VERSION" ]; then
            echo "Cargo.toml version $version does not match tag version $MOD_VERSION"; exit 1
          fi
          echo "MOD=$name" >> "$GITHUB_ENV"

      - run: cargo build --release -p ${{ env.MOD }}

      # Only the one this system built exists.
      - uses: actions/upload-artifact@v7
        with:
          name: library-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/${{ env.MOD }}.dll
            target/release/lib${{ env.MOD }}.so
            target/release/lib${{ env.MOD }}.dylib

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: pack
          merge-multiple: true

      # The zip is named like the mod, which is what the game looks for. Players put it in their mods folder.
      - name: Pack and publish
        run: |
          mod=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          if [ -d assets ]; then cp -r assets pack/; fi
          (cd pack && zip -r "../$mod.zip" .)
          gh release create "$GITHUB_REF_NAME" "$mod.zip" --verify-tag --generate-notes
